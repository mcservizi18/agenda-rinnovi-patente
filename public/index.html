<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Agenda Rinnovi Patente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra agenzia rossa/nera con fascia gialla, schede sotto; agenda = striscia settimana + griglia a slot del giorno */
:root{
  --bg:#f6f4f2; --surface:#ffffff; --surface-2:#efebe8; --line:#ddd6d1;
  --fg:#1b1716; --muted:#6b625e;
  --red:#c4161c; --red-ink:#a31217; --red-soft:#fbe7e7;
  --yellow:#f5c400; --yellow-soft:#fff5c7; --ink:#141111;
  --ok:#1f7a45; --ok-soft:#e2f3e8; --warn:#9a6200; --warn-soft:#fdf0d5; --bad:#b3261e; --bad-soft:#fbe4e2;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161312; --surface:#211d1c; --surface-2:#2b2625; --line:#3a3432;
  --fg:#f2eeec; --muted:#a79e9a;
  --red:#ef4a4f; --red-ink:#ff7a7e; --red-soft:#3d1c1d;
  --yellow:#f5c400; --yellow-soft:#3a3212; --ink:#0c0a0a;
  --ok:#5cc98a; --ok-soft:#173226; --warn:#f0b54a; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1d1b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161312; --surface:#211d1c; --surface-2:#2b2625; --line:#3a3432;
  --fg:#f2eeec; --muted:#a79e9a;
  --red:#ef4a4f; --red-ink:#ff7a7e; --red-soft:#3d1c1d;
  --yellow:#f5c400; --yellow-soft:#3a3212; --ink:#0c0a0a;
  --ok:#5cc98a; --ok-soft:#173226; --warn:#f0b54a; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1d1b;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

header.top{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.badge{background:var(--red);color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em;padding:2px 9px;border-radius:4px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font-size:12px;color:#c9c1bd;letter-spacing:.06em;text-transform:uppercase}
.band{height:6px;background:var(--yellow)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;color:#d8d0cc;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--red);color:#fff}
nav.tabs button:hover{color:#fff}
nav.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--yellow);color:#141111;font-size:11px;text-align:center}

main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi.alert b{color:var(--red)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h2{font-family:var(--font-display);font-size:24px;margin:0 auto 0 0;text-transform:capitalize;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px;text-align:center;cursor:pointer;min-width:0}
.day .dw{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--font-display);font-size:24px;line-height:1.1}
.day .dc{font-size:12px;color:var(--muted);min-height:18px}
.day.has-med{box-shadow:inset 0 -4px 0 var(--yellow)}
.day.today .dn{color:var(--red)}
.day[aria-pressed="true"]{border-color:var(--red);outline:1px solid var(--red)}
@media (max-width:520px){.day .dw{font-size:10px}.day .dn{font-size:20px}.day{padding:6px 2px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.panel-h .t{font-weight:600}
.panel-h .s{color:var(--muted);font-size:13px;margin-right:auto}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .tm{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.slot.free .who{color:var(--muted);font-size:13px}
.slot.busy .tm{color:var(--fg)}
.who{min-width:0}
.who .nm{font-weight:600;cursor:pointer}
.who .nm:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.slot{grid-template-columns:52px minmax(0,1fr)}.slot .acts{grid-column:2;justify-content:flex-start}}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.cat{font-family:var(--font-mono);background:var(--ink);color:#fff;border-radius:3px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--yellow-soft);color:var(--fg)}

.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .d{font-size:13px}
.row .d b{display:block;font-family:var(--font-mono);font-size:14px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.row .acts{justify-content:flex-start}}
/* incasso rapido */
.slot.busy{grid-template-columns:62px minmax(0,1fr) auto auto}
.row.has-pay{grid-template-columns:120px minmax(0,1fr) auto auto}
.pay{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pay .grp{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.pay .grp.need{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow-soft)}
.chip{border:0;border-right:1px solid var(--line);background:transparent;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center;white-space:nowrap}
.chip:last-child{border-right:0}
.chip small{display:block;font-size:10px;font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.chip:hover:not(:disabled){color:var(--fg);background:var(--surface-2)}
.chip.on{background:var(--ok);color:#fff}
.chip.on.mod{background:var(--ink);color:#fff}
.chip:disabled{cursor:default}
.paysum{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.paysum b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
@media (max-width:760px){.slot.busy{grid-template-columns:62px minmax(0,1fr) auto}.slot.busy .acts{grid-column:2/-1;justify-content:flex-start}.row.has-pay{grid-template-columns:120px minmax(0,1fr) auto}.row.has-pay .acts{grid-column:2/-1;justify-content:flex-start}}
@media (max-width:560px){.slot.busy{grid-template-columns:52px minmax(0,1fr)}.slot.busy .pay,.slot.busy .acts{grid-column:2}.row.has-pay{grid-template-columns:minmax(0,1fr)}.row.has-pay .pay,.row.has-pay .acts{grid-column:1}}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.filters input{flex:1 1 220px}

.note{font-size:13px;color:var(--muted);max-width:70ch}

/* accesso */
.login{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:32px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.login-card .lh{background:var(--ink);color:#fff;padding:18px 20px;border-bottom:6px solid var(--yellow);display:flex;gap:10px;align-items:center}
.login-card .lh h2{font-family:var(--font-display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.login-card .lh small{display:block;color:#c9c1bd;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.login-card form{padding:20px;display:flex;flex-direction:column;gap:12px}
.userbox{display:flex;align-items:center;gap:6px;color:#d8d0cc;font-size:13px}
.userbox b{color:#fff;font-weight:600;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbox button{background:transparent;border:1px solid #4a4240;color:#d8d0cc;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.userbox button:hover{color:#fff;border-color:#8a807c}
/* modale */
.ov{position:fixed;inset:0;background:rgba(10,8,8,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;width:100%;max-width:680px;box-shadow:0 18px 50px rgba(0,0,0,.35);margin-block:24px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:4px solid var(--yellow);background:var(--ink);color:#fff;border-radius:10px 10px 0 0}
.modal-h h3{font-family:var(--font-display);font-size:22px;margin:0;margin-right:auto;text-transform:uppercase;letter-spacing:.02em}
.modal-h button{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal-f .sp{margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);width:100%;min-width:0}
label.f textarea{min-height:64px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0}
legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
@media (max-width:520px){.checks{grid-template-columns:minmax(0,1fr)}}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--red)}
.calc{background:var(--yellow-soft);border-radius:6px;padding:9px 12px;font-size:14px}
.calc.bad{background:var(--bad-soft);color:var(--bad)}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:14px}
.formerr{color:var(--bad);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;z-index:60;border-left:4px solid var(--yellow)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="badge">MC</span><div><h1>Rinnovi patente</h1><small>Agenzia MC Servizi · Palermo</small></div></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="agenda" aria-selected="true">Agenda</button>
      <button role="tab" data-tab="elenco" aria-selected="false">Appuntamenti</button>
      <button role="tab" data-tab="scadenze" aria-selected="false">Da richiamare<span class="n" id="nScad" hidden></span></button>
      <button role="tab" data-tab="giornate" aria-selected="false">Giornate medico</button>
      <button role="tab" data-tab="utenti" aria-selected="false" id="tabUtenti" hidden>Utenti</button>
    </nav>
    <div class="userbox" id="userbox" hidden><b id="whoami"></b><button type="button" id="btnPw">Password</button><button type="button" id="btnOut">Esci</button></div>
  </div>
  <div class="band"></div>
</header>

<section class="login" id="login" hidden>
  <div class="login-card">
    <div class="lh"><span class="badge">MC</span><div><h2>Rinnovi patente</h2><small>Accesso riservato ai collaboratori</small></div></div>
    <form id="loginForm" novalidate>
      <label class="f">Nome utente<input name="username" id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="f">Password<input name="password" id="l-pw" type="password" autocomplete="current-password" required></label>
      <div class="formerr" id="lerr" hidden></div>
      <button type="submit" class="btn primary" id="l-btn">Entra</button>
    </form>
  </div>
</section>
<main id="app" hidden>
  <div class="status" id="status">Caricamento agenda…</div>
  <section class="kpis" id="kpis"></section>
  <section id="view"></section>
</main>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ---------- utilità date ---------- */
const GG=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const GGL=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const mondayOf=s=>{const d=pd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d);};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtShort=s=>{if(!s)return"—";const d=pd(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();};
const fmtLong=s=>{const d=pd(s);return GGL[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()]+" "+d.getFullYear();};
const toMin=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+m;};
const toHM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>(Number(n)||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});

/* ---------- dominio ---------- */
const CATEGORIE=["B","AM","A1","A2","A","B+A","BE","C1","C","CE","D1","D","DE","Altro"];
const STATI={prenotato:{l:"Prenotato",c:""},confermato:{l:"Confermato",c:"info"},visitato:{l:"Visita fatta",c:"ok"},concluso:{l:"Pratica chiusa",c:"ok"},assente:{l:"Non presentato",c:"bad"},annullato:{l:"Annullato",c:"bad"}};
const DOCS=[["identita","Documento d'identità"],["patente","Patente da rinnovare"],["cf","Tessera sanitaria / cod. fiscale"],["foto","Foto tessera"],["pagopa","Ricevute PagoPA (diritti + bollo)"],["anamnestico","Certificato anamnestico (se richiesto)"]];
const DOCS_REQ=["identita","patente","cf","foto","pagopa"];

/* Validità art. 126 CdS: la nuova scadenza cade al compleanno successivo */
function validita(cat,nascita,dataVisita){
  if(!nascita||!cat)return null;
  const eta=etaAl(nascita,dataVisita||today());
  const g=cat.replace("+A","");
  let anni=null,nota="";
  if(["AM","A1","A2","A","B","BE","B1"].includes(g)){
    anni=eta<50?10:eta<70?5:eta<80?3:2;
  }else if(["C1","C","CE","C1E"].includes(g)){
    if(eta<65){anni=5;}else{anni=2;nota="Oltre i 65 anni: verificare se serve la commissione medica locale.";}
  }else if(["D1","D","DE","D1E"].includes(g)){
    if(eta<60){anni=5;}else{nota="Oltre i 60 anni la categoria D si rinnova presso la commissione medica locale.";}
  }
  if(!anni)return{eta,anni:null,nota};
  const v=pd(dataVisita||today());v.setFullYear(v.getFullYear()+anni);
  const n=pd(nascita);let sc=new Date(v.getFullYear(),n.getMonth(),n.getDate());
  if(sc<v)sc=new Date(v.getFullYear()+1,n.getMonth(),n.getDate());
  return{eta,anni,scad:ds(sc),nota};
}
function etaAl(nascita,al){const n=pd(nascita),a=pd(al);let e=a.getFullYear()-n.getFullYear();if(a.getMonth()<n.getMonth()||(a.getMonth()===n.getMonth()&&a.getDate()<n.getDate()))e--;return e;}
const docsMancanti=a=>DOCS_REQ.filter(k=>!(a.doc&&a.doc[k]));
const attivo=a=>!["annullato","assente"].includes(a.stato);

/* ---------- stato ---------- */
const S={tab:"agenda",day:today(),sess:[],app:[],scad:[],nomi:{},utenti:[],me:null,ver:0,readOnly:false,q:"",fStato:"futuri",fScad:"90",lock:false};
try{const t=localStorage.getItem("rp-tab");if(t)S.tab=t;}catch(e){}

const $=s=>document.querySelector(s);
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function setStatus(t,err){const el=$("#status");el.textContent=t||"";el.hidden=!t;el.classList.toggle("err",!!err);}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  const daChiamare=scadenzeFiltrate("90").length;
  const n=$("#nScad");n.hidden=!daChiamare;n.textContent=daChiamare;
  renderKpis();
  const v=$("#view");
  if(S.tab==="agenda")v.innerHTML=viewAgenda();

const TARIFFE=[[70,"agenzia","Ritiro in agenzia"],[77,"recapito","Spedita al recapito"]];
const MODALITA=[["contanti","Contanti"],["pos","POS"]];
function payBox(a){
  const dis=S.readOnly?"disabled":"";
  const imp=a.pagato?Number(a.importo):0;
  const t=TARIFFE.map(([v,k,l])=>`<button type="button" class="chip ${imp===v?"on":""}" data-act="pay" data-v="${v}" data-id="${a.id}" title="${l}" aria-pressed="${imp===v}" ${dis}>${v} €<small>${k}</small></button>`).join("");
  const m=MODALITA.map(([k,l])=>`<button type="button" class="chip mod ${a.pagamento===k?"on":""}" data-act="mod" data-v="${k}" data-id="${a.id}" aria-pressed="${a.pagamento===k}" ${dis}>${l}</button>`).join("");
  return `<div class="pay" aria-label="Pagamento"><span class="grp">${t}</span><span class="grp ${a.pagato&&!a.pagamento?"need":""}" title="${a.pagato&&!a.pagamento?"Indica come ha pagato":"Modalità di pagamento"}">${m}</span></div>`;
}
function incassi(list){const r={contanti:0,pos:0,altro:0,tot:0,n:0};list.forEach(a=>{if(!a.pagato||!a.importo)return;const v=Number(a.importo)||0;r.tot+=v;r.n++;r[a.pagamento==="contanti"?"contanti":a.pagamento==="pos"?"pos":"altro"]+=v;});return r;}
function paySummary(r){return `<span>Incassato <b>${euro(r.tot)}</b></span><span>Contanti <b>${euro(r.contanti)}</b></span><span>POS <b>${euro(r.pos)}</b></span>${r.altro?`<span style="color:var(--warn)">Senza modalità <b>${euro(r.altro)}</b></span>`:""}`;}
async function setPay(id,kind,v){
  const a=S.app.find(x=>x.id===id);if(!a||S.readOnly)return;
  const r=Object.assign({},a);
  if(kind==="pay"){
    const on=r.pagato&&Number(r.importo)===v;
    if(on){r.pagato=false;r.importo=null;r.consegna="";r.pagatoIl="";}
    else{r.pagato=true;r.importo=v;r.consegna=v===77?"recapito":"agenzia";r.pagatoIl=r.pagatoIl||today();}
  }else{r.pagamento=r.pagamento===v?"":v;}
  Object.assign(a,r);if(!$("#ov"))render();
  await saveDoc("appuntamenti",id,r);
}
function pillsApp(a){
  const st=STATI[a.stato]||STATI.prenotato;
  const m=docsMancanti(a);
  let h=`<span class="pill cat">${esc(a.categoria||"B")}</span><span class="pill ${st.c}">${st.l}</span>`;
  if(attivo(a)&&!["concluso"].includes(a.stato))h+=m.length?`<span class="pill warn" title="${esc(m.map(k=>DOCS.find(d=>d[0]===k)[1]).join(", "))}">Mancano ${m.length} doc.</span>`:`<span class="pill ok">Documenti ok</span>`;
  if(a.scadenza&&a.scadenza<(a.data||today()))h+=`<span class="pill bad">Patente scaduta</span>`;
  if(a.importo&&![70,77].includes(Number(a.importo)))h+=`<span class="pill ${a.pagato?"ok":"warn"}">${euro(a.importo)}${a.pagato?" pagato":" da incassare"}</span>`;
  if(!a.pagato&&attivo(a)&&["visitato","concluso"].includes(a.stato))h+=`<span class="pill warn">Da incassare</span>`;
  return h;
}
function actsApp(a){
  let h=`<button class="btn sm ghost" data-act="wa" data-id="${a.id}">Promemoria</button>`;
  if(!S.readOnly&&a.stato==="prenotato")h+=`<button class="btn sm" data-act="stato" data-v="confermato" data-id="${a.id}">Confermato</button>`;
  if(!S.readOnly&&["prenotato","confermato"].includes(a.stato))h+=`<button class="btn sm" data-act="stato" data-v="visitato" data-id="${a.id}">Visita fatta</button>`;

function slotsOf(s){const out=[];const st=Math.max(5,Number(s.slotMin)||10);for(let m=toMin(s.inizio);m+st<=toMin(s.fine);m+=st)out.push(toHM(m));return out;}

function viewAgenda(){
  const ws=mondayOf(S.day),t=today();
  let week="";
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),dd=pd(d);
    const n=S.app.filter(a=>a.data===d&&attivo(a)).length;
    const med=S.sess.some(s=>s.data===d);
    week+=`<button class="day ${med?"has-med":""} ${d===t?"today":""}" aria-pressed="${d===S.day}" data-act="day" data-d="${d}"><div class="dw">${GG[dd.getDay()]}</div><div class="dn mono">${dd.getDate()}</div><div class="dc">${n?n+" app.":med?"medico":""}</div></button>`;
  }
  const sess=S.sess.filter(s=>s.data===S.day).sort((a,b)=>a.inizio.localeCompare(b.inizio));
  const apps=S.app.filter(a=>a.data===S.day).sort((a,b)=>(a.ora||"").localeCompare(b.ora||""));
  const usati=new Set();
  let body="";
  sess.forEach(s=>{
    const sl=slotsOf(s);
    const occ=apps.filter(a=>a.sessioneId===s.id&&attivo(a));
    body+=`<div class="panel"><div class="panel-h"><span class="t">${esc(s.medico||"Medico")} · <span class="mono">${esc(s.inizio)}–${esc(s.fine)}</span></span><span class="s">Slot da ${esc(s.slotMin)} min · ${occ.length}/${sl.length} occupati${s.note?" · "+esc(s.note):""}</span>${S.readOnly?"":`<button class="btn sm" data-act="editSess" data-id="${s.id}">Modifica giornata</button>`}</div>`;
    sl.forEach(h=>{
      const here=apps.filter(a=>a.sessioneId===s.id&&a.ora===h);
      const live=here.filter(attivo);
      here.forEach(a=>usati.add(a.id));
      if(!live.length){
        body+=`<div class="slot free"><span class="tm">${h}</span><span class="who">Libero${here.length?" · "+here.length+" annullato/assente":""}</span><div class="acts">${S.readOnly?"":`<button class="btn sm primary" data-act="book" data-sess="${s.id}" data-ora="${h}">Prenota</button>`}</div></div>`;
      }
      live.forEach(a=>{
        body+=`<div class="slot busy"><span class="tm">${h}</span><div class="who"><span class="nm" data-act="edit" data-id="${a.id}">${esc(a.cognome)} ${esc(a.nome)}</span>${a.telefono?` <span class="mono" style="font-size:13px;color:var(--muted)">${esc(a.telefono)}</span>`:""}<div class="meta">${pillsApp(a)}</div></div>${payBox(a)}<div class="acts">${actsApp(a)}</div></div>`;
      });
    });
    body+=`</div>`;
  });
  const fuori=apps.filter(a=>!usati.has(a.id));
  if(fuori.length){
    body+=`<div class="panel"><div class="panel-h"><span class="t">${sess.length?"Fuori dagli slot del medico":"Appuntamenti del giorno"}</span><span class="s"></span></div>`;
    fuori.forEach(a=>{body+=`<div class="slot busy"><span class="tm">${esc(a.ora||"--:--")}</span><div class="who"><span class="nm" data-act="edit" data-id="${a.id}">${esc(a.cognome)} ${esc(a.nome)}</span><div class="meta">${pillsApp(a)}</div></div>${payBox(a)}<div class="acts">${actsApp(a)}</div></div>`;});
    body+=`</div>`;
  }
  if(!sess.length&&!fuori.length){
    body=`<div class="panel"><div class="empty"><strong>Nessuna giornata del medico il ${esc(fmtLong(S.day))}</strong>Aggiungi la giornata con orario e durata delle visite: l'agenda si divide in slot da prenotare. Puoi anche inserire un appuntamento a orario libero.</div></div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="bar"><h2>${esc(fmtLong(S.day))}</h2>
      <button class="btn ghost" data-act="wk" data-n="-7" aria-label="Settimana precedente">‹</button>
      <button class="btn ghost" data-act="day" data-d="${t}">Oggi</button>
      <button class="btn ghost" data-act="wk" data-n="7" aria-label="Settimana successiva">›</button>
      <input type="date" id="jump" class="btn" value="${S.day}" aria-label="Vai alla data">
    </div>
    <div class="week">${week}</div>
    <div class="bar">
      ${S.readOnly?"":`<button class="btn primary" data-act="book">+ Appuntamento</button><button class="btn" data-act="newSess">+ Giornata medico</button>`}
      ${apps.length?`<button class="btn ghost" data-act="csv">Scarica elenco del giorno</button>`:""}
    </div>
    ${apps.some(a=>a.pagato)?`<div class="paysum">${paySummary(incassi(apps))}</div>`:""}
    ${body}</div>`;
}

  else if(S.fStato==="incasso")list=list.filter(a=>!a.pagato&&attivo(a)&&a.data<=t);
  else if(S.fStato==="aperti")list=list.filter(a=>a.stato==="visitato");

  const asc=["futuri","docs"].includes(S.fStato);
  list.sort((a,b)=>((a.data||"")+(a.ora||"")).localeCompare((b.data||"")+(b.ora||""))*(asc?1:-1));

      <select id="fStato" aria-label="Filtro">
        ${[["futuri","Da oggi in poi"],["docs","Con documenti mancanti"],["aperti","Visita fatta, pratica da chiudere"],["incasso","Da incassare (visite già passate)"],["tutti","Tutti"],...Object.entries(STATI).map(([k,v])=>[k,v.l])].map(([k,l])=>`<option value="${k}" ${S.fStato===k?"selected":""}>${l}</option>`).join("")}
      </select></div>
    <div class="panel">${rows?`<div class="list">${rows}</div>`:`<div class="empty"><strong>Nessun appuntamento</strong>${S.app.length?"Nessun risultato con questi filtri.":"Gli appuntamenti prenotati dall'agenda compaiono qui, con ricerca per nome, telefono o numero di patente."}</div>`}</div></div>`;
}

function scadenzeFiltrate(f){
  const t=today();
  return S.scad.filter(s=>!s.prenotato).filter(s=>{
    if(!s.scadenza)return f==="tutti";
    const d=diffDays(t,s.scadenza);
    if(f==="scadute")return d<0;
    if(f==="tutti")return true;
    return d<=Number(f);
  }).sort((a,b)=>(a.scadenza||"9").localeCompare(b.scadenza||"9"));
}

/* ---------- CSV ---------- */
async function downloadCsv(){
  const apps=S.app.filter(a=>a.data===S.day&&attivo(a)).sort((a,b)=>(a.ora||"").localeCompare(b.ora||""));
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines=[["Ora","Cognome","Nome","Nato il","Categoria","N. patente","Scadenza","Telefono","Documenti mancanti","Importo","Consegna","Pagamento","Note"].map(q).join(";")];
  apps.forEach(a=>lines.push([a.ora,a.cognome,a.nome,fmtShort(a.nascita),a.categoria,a.numeroPatente,fmtShort(a.scadenza),a.telefono,docsMancanti(a).map(k=>DOCS.find(d=>d[0]===k)[1]).join(", "),a.pagato&&a.importo?String(a.importo).replace(".",","):"",a.consegna==="recapito"?"Recapito":a.consegna==="agenzia"?"Agenzia":"",a.pagamento==="pos"?"POS":a.pagamento==="contanti"?"Contanti":"",a.note].map(q).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`rinnovi-${S.day}.csv`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------- server: accesso e archivio ---------- */
const RUOLI={admin:"Amministratore",operatore:"Operatore",consultazione:"Sola consultazione"};
async function api(method,url,body){
  let r;
  try{r=await fetch(url,{method,credentials:"same-origin",headers:{"Content-Type":"application/json","X-Requested-With":"rinnovi"},body:body?JSON.stringify(body):undefined});}
  catch(e){throw Object.assign(new Error("Connessione assente: controlla internet e riprova."),{status:0});}
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401&&url!=="/api/login"){showLogin();throw Object.assign(new Error(j.errore||"Accesso richiesto"),{status:401});}
  if(r.status===403&&j.cambiaPassword){openPw(true);}
  if(!r.ok)throw Object.assign(new Error(j.errore||"Errore "+r.status),{status:r.status});
  return j;
}
let reqSeq=0;
async function refresh(force){
  if(!S.me||S.me.cambiaPassword)return;
  const my=++reqSeq;
  try{
    const j=await api("GET","/api/dati"+(!force&&S.ver?"?v="+S.ver:""));
    if(my!==reqSeq)return;
    setStatus("");
    if(j.invariato)return;
    S.sess=j.sessioni;S.app=j.appuntamenti;S.scad=j.scadenze;S.nomi=j.nomi||{};S.ver=j.versione;
    if(!$("#ov"))render();else renderKpis();
  }catch(e){
    if(e.status===0)setStatus("Connessione assente: i dati mostrati potrebbero non essere aggiornati.",true);
  }
}
let pollT=null;
function startPoll(){stopPoll();pollT=setInterval(()=>{if(!document.hidden)refresh();},10000);}
function stopPoll(){if(pollT)clearInterval(pollT);pollT=null;}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});

async function saveDoc(col,id,rec){
  if(S.readOnly){toast("Il tuo utente può solo consultare l'agenda");return false;}
  const clean=JSON.parse(JSON.stringify(rec));delete clean.id;
  try{await api("PUT","/api/"+col+"/"+encodeURIComponent(id),clean);await refresh(true);return true;}
  catch(e){if(e.status!==401)toast(e.message||"Salvataggio non riuscito, riprova");return false;}
}
async function removeDoc(col,id){
  try{await api("DELETE","/api/"+col+"/"+encodeURIComponent(id));await refresh(true);}
  catch(e){if(e.status!==401)toast(e.message||"Eliminazione non riuscita");}
}

function setUser(u){
  S.me=u;S.readOnly=u.ruolo==="consultazione";
  $("#login").hidden=true;$("#app").hidden=false;$("#tabs").hidden=false;$("#userbox").hidden=false;
  $("#whoami").textContent=u.nome||u.username;$("#whoami").title=u.username+" · "+(RUOLI[u.ruolo]||u.ruolo);
  $("#tabUtenti").hidden=u.ruolo!=="admin";
  if(S.tab==="utenti"&&u.ruolo!=="admin")S.tab="agenda";
  render();
  if(u.cambiaPassword){openPw(true);return;}
  setStatus("Caricamento agenda…");
  refresh(true);startPoll();
  if(S.tab==="utenti")loadUtenti();
}
function showLogin(){
  S.me=null;S.ver=0;S.sess=[];S.app=[];S.scad=[];S.utenti=[];S.lock=false;stopPoll();
  $("#modalRoot").innerHTML="";
  $("#app").hidden=true;$("#tabs").hidden=true;$("#userbox").hidden=true;$("#login").hidden=false;
  setTimeout(()=>{const u=$("#l-user");if(u&&!u.value)u.focus();else if($("#l-pw"))$("#l-pw").focus();},0);
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target,err=$("#lerr"),b=$("#l-btn");
  err.hidden=true;
  const username=f.elements.username.value.trim(),password=f.elements.password.value;
  if(!username||!password){err.textContent="Inserisci nome utente e password.";err.hidden=false;return;}
  b.disabled=true;b.textContent="Accesso…";
  try{const j=await api("POST","/api/login",{username,password});f.elements.password.value="";setUser(j.utente);}
  catch(x){err.textContent=x.message;err.hidden=false;f.elements.password.select();}
  finally{b.disabled=false;b.textContent="Entra";}
});
$("#btnOut").addEventListener("click",async()=>{try{await api("POST","/api/logout");}catch(e){}showLogin();});
$("#btnPw").addEventListener("click",()=>openPw(false));

function openPw(forced){
  if(forced&&S.lock)return;
  S.lock=!!forced;
  const body=`${forced?`<p class="note">Per sicurezza, al primo accesso scegli una password personale (almeno 8 caratteri). La password ricevuta smetterà di funzionare.</p>`:""}
    <label class="f">Password attuale<input name="attuale" id="p-old" type="password" autocomplete="current-password" required></label>
    <label class="f">Nuova password<input name="nuova" id="p-new" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="f">Ripeti la nuova password<input name="conferma" id="p-conf" type="password" autocomplete="new-password" required></label>
    <div class="formerr" id="ferr" hidden></div>`;
  const foot=`<span class="sp"></span>${forced?`<button type="button" class="btn" id="pOut">Esci</button>`:`<button type="button" class="btn" data-close>Annulla</button>`}<button type="submit" class="btn primary">Cambia password</button>`;
  openModal(forced?"Scegli la tua password":"Cambia password",body,foot,f=>{
    if(forced){const x=document.querySelector("#ov .modal-h [data-close]");if(x)x.remove();$("#pOut").onclick=async()=>{S.lock=false;try{await api("POST","/api/logout");}catch(e){}showLogin();};}
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const err=$("#ferr");err.hidden=true;
      const nuova=f.elements.nuova.value;
      if(nuova.length<8){err.textContent="La nuova password deve avere almeno 8 caratteri.";err.hidden=false;return;}
      if(nuova!==f.elements.conferma.value){err.textContent="Le due nuove password non coincidono.";err.hidden=false;return;}
      try{
        const j=await api("POST","/api/me/password",{attuale:f.elements.attuale.value,nuova});
        S.lock=false;closeModal();toast("Password cambiata");
        if(forced)setUser(j.utente);else S.me=j.utente;
      }catch(x){if(x.status!==401){err.textContent=x.message;err.hidden=false;}}
    });
  });
}

/* ---------- utenti (amministratore) ---------- */
async function loadUtenti(){
  if(!S.me||S.me.ruolo!=="admin")return;
  try{const j=await api("GET","/api/utenti");S.utenti=j.utenti;if(S.tab==="utenti"&&!$("#ov"))render();}catch(e){if(e.status!==401)toast(e.message);}
}
function fmtTs(t){if(!t)return"mai";return fmtShort(t.slice(0,10))+" "+new Date(t).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}
function viewUtenti(){
  const rows=S.utenti.slice().sort((a,b)=>(b.attivo-a.attivo)||(a.nome||"").localeCompare(b.nome||"")).map(u=>`<div class="row"><div class="d"><b>${esc(u.username)}</b>${u.id===S.me.id?"sei tu":""}</div>
    <div class="who"><span class="nm" data-act="editUser" data-id="${u.id}">${esc(u.nome)}</span>
    <div class="meta"><span class="pill ${u.ruolo==="admin"?"info":""}">${RUOLI[u.ruolo]||u.ruolo}</span>${u.attivo?`<span class="pill ok">Attivo</span>`:`<span class="pill bad">Disattivato</span>`}${u.cambiaPassword&&u.attivo?`<span class="pill warn">Deve scegliere la password</span>`:""}<span class="pill">Ultimo accesso: ${fmtTs(u.ultimoAccesso)}</span></div></div>
    <div class="acts"><button class="btn sm" data-act="editUser" data-id="${u.id}">Modifica</button></div></div>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="bar"><h2>Utenti</h2><button class="btn primary" data-act="newUser">+ Nuovo utente</button></div>
    <p class="note">Crea un utente per ogni collaboratore e comunicagli nome utente e password provvisoria: al primo accesso dovrà sceglierne una sua. <b>Operatore</b> prenota e modifica; <b>Sola consultazione</b> vede l'agenda senza cambiarla; <b>Amministratore</b> gestisce anche gli utenti. Per bloccare l'accesso a qualcuno, disattivalo.</p>
    <div class="panel">${rows?`<div class="list">${rows}</div>`:`<div class="empty"><strong>Caricamento utenti…</strong></div>`}</div></div>`;
}
function genPw(){const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";const a=new Uint32Array(10);crypto.getRandomValues(a);return Array.from(a,n=>c[n%c.length]).join("");}
function openUser(u){
  const isNew=!u;u=u||{ruolo:"operatore",attivo:true};
  const isMe=!isNew&&u.id===S.me.id;
  const body=`<div class="grid">
    <label class="f">Nome e cognome<input name="nome" id="u-nome" value="${esc(u.nome)}" placeholder="Es. Lucia Bianchi"></label>
    <label class="f">Nome utente${isNew?" *":""}<input name="username" id="u-user" value="${esc(u.username)}" ${isNew?"":"disabled"} autocapitalize="none" spellcheck="false" placeholder="es. lucia"></label>
    <label class="f">Ruolo<select name="ruolo" id="u-ruolo" ${isMe?"disabled":""}>${Object.entries(RUOLI).map(([k,l])=>`<option value="${k}" ${k===u.ruolo?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">${isNew?"Password provvisoria *":"Nuova password provvisoria"}<input name="password" id="u-pw" value="${isNew?genPw():""}" autocomplete="off" spellcheck="false" placeholder="${isNew?"":"Lascia vuoto per non cambiarla"}"></label>
    ${isNew||isMe?"":`<label class="f full"><span class="checks"><label style="text-transform:none;font-weight:500;color:var(--fg)"><input type="checkbox" name="attivo" id="u-att" ${u.attivo?"checked":""}> Utente attivo (può accedere)</label></span></label>`}
    </div>
    <p class="note">${isNew?"Annota la password provvisoria e comunicala al collaboratore insieme al nome utente: al primo accesso dovrà cambiarla.":"Se imposti una nuova password provvisoria, il collaboratore viene disconnesso e al prossimo accesso dovrà sceglierne una sua."}</p>
    <div class="formerr" id="ferr" hidden></div>`;
  const foot=`<span class="sp"></span><button type="button" class="btn" data-close>Annulla</button><button type="submit" class="btn primary">${isNew?"Crea utente":"Salva"}</button>`;
  openModal(isNew?"Nuovo utente":"Utente "+u.username,body,foot,f=>{
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const err=$("#ferr");err.hidden=true;
      const pw=f.elements.password.value.trim();
      if((isNew||pw)&&pw.length<8){err.textContent="La password deve avere almeno 8 caratteri.";err.hidden=false;return;}
      try{
        if(isNew)await api("POST","/api/utenti",{username:f.elements.username.value.trim(),nome:f.elements.nome.value.trim(),ruolo:f.elements.ruolo.value,password:pw});
        else{const b={nome:f.elements.nome.value.trim()};if(!isMe)b.ruolo=f.elements.ruolo.value;if(pw)b.password=pw;if(f.elements.attivo)b.attivo=f.elements.attivo.checked;await api("PUT","/api/utenti/"+u.id,b);}
        closeModal();toast(isNew?"Utente creato":"Utente aggiornato");await loadUtenti();refresh(true);
        if(isMe){const j=await api("GET","/api/me");S.me=j.utente;$("#whoami").textContent=j.utente.nome;}
      }catch(x){if(x.status!==401){err.textContent=x.message;err.hidden=false;}}
    });
  });
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="newUser")openUser(null);
  else if(t.dataset.act==="editUser"){const u=S.utenti.find(x=>x.id===t.dataset.id);if(u)openUser(u);}
});

/* ---------- avvio ---------- */
(async()=>{
  try{const j=await api("GET","/api/me");setUser(j.utente);}
  catch(e){if(e.status===0){$("#login").hidden=false;$("#lerr").textContent=e.message;$("#lerr").hidden=false;}}
})();
})();
</script>
</body>
</html>
